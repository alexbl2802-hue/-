name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Copy game into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ZemliPriklyucheniy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZemliPriklyucheniy-apk
          path: ZemliPriklyucheniy.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Земли Приключений 1.0.${{ github.run_number }}
          body: |
            Скачай **ZemliPriklyucheniy.apk** на телефон Android и установи его.
            Если телефон спросит — разреши установку из этого источника.
          files: ZemliPriklyucheniy.apk
          make_latest: true
