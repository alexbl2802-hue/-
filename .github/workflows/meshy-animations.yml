name: Meshy animations

# По команде (вкладка Actions → Meshy animations → Run workflow): скелет и анимации из Meshy
# по API, готовые .glb складываются в meshy/<имя>/ и отправляются в репозиторий.
# Ключ — секрет репозитория MESHY_API_KEY.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Папка результата (meshy/<имя>)"
        default: "hero"
      model_path:
        description: "Модель в репозитории для риггинга (если нет rig_task_id)"
        default: "godot/models/hero.glb"
      rig_task:
        description: "Готовый rig_task_id (тогда риггинг пропускается)"
        default: ""
      actions:
        description: "Номера движений из библиотеки Meshy через запятую"
        default: ""
      height:
        description: "Рост персонажа, м"
        default: "1.8"
      retexture:
        description: "Файл JSON {набор: описание} — перекрасить модель (Retexture) вместо анимаций"
        default: ""
      list_only:
        description: "Только список моделей аккаунта (без кредитов) в meshy/<имя>/list.json"
        type: boolean
        default: false
      docs_only:
        description: "Только скачать документацию Meshy (список движений) в meshy/docs — без кредитов"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: meshy
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Meshy docs (animation library)
        if: inputs.docs_only
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          mkdir -p meshy/docs
          cd meshy/docs
          for u in \
            https://docs.meshy.ai/llms.txt \
            https://docs.meshy.ai/llms-full.txt \
            https://docs.meshy.ai/en/api/rigging-and-animation \
            https://docs.meshy.ai/en/api/animation-library \
            https://docs.meshy.ai/en/api/rigging \
            https://docs.meshy.ai/en/api/animation \
            https://docs.meshy.ai/en/api/quick-start \
            https://docs.meshy.ai/api/animation-library \
            https://docs.meshy.ai/api/rigging-and-animation; do
            f=$(echo "$u" | sed 's#https://##; s#[/]#_#g')
            code=$(curl -sL -A "Mozilla/5.0" -o "$f" -w "%{http_code}" "$u" || echo 000)
            echo "$code $u" | tee -a index.txt
            [ "$code" = "200" ] || rm -f "$f"
          done
          # Ссылки из llms.txt на страницы про анимации — тоже скачать (markdown-версии)
          if [ -f docs.meshy.ai_llms.txt ]; then
            grep -oE 'https://docs\.meshy\.ai[^) ]*' docs.meshy.ai_llms.txt | grep -iE 'anim|rig' | sort -u | head -20 | while read -r u; do
              f=$(echo "$u" | sed 's#https://##; s#[/]#_#g')
              code=$(curl -sL -A "Mozilla/5.0" -o "$f" -w "%{http_code}" "$u" || echo 000)
              echo "$code $u" | tee -a index.txt
              [ "$code" = "200" ] || rm -f "$f"
            done
          fi
          # Каталог движений (номер, название, категория, превью) — JSON
          curl -sL -A "Mozilla/5.0" -o animations_resources.json -w "%{http_code} catalog\n" https://api.meshy.ai/web/public/animations/resources | tee -a index.txt
          curl -sL -H "Authorization: Bearer $MESHY_API_KEY" -o animations_library.json -w "%{http_code} library\n" https://api.meshy.ai/openapi/v1/animations/library | tee -a index.txt
          ls -la

      - name: Fetch from Meshy
        if: ${{ !inputs.docs_only }}
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
          IN_NAME: ${{ inputs.name }}
          IN_MODEL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/${{ inputs.model_path }}
          IN_RIG: ${{ inputs.rig_task }}
          IN_ACTIONS: ${{ inputs.actions }}
          IN_HEIGHT: ${{ inputs.height }}
          IN_RETEX: ${{ inputs.retexture }}
          REPO_RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/
        run: |
          python3 tools/meshy_fetch.py --name "$IN_NAME" --model-url "$IN_MODEL" \
            --rig-task "$IN_RIG" --actions "$IN_ACTIONS" --height "$IN_HEIGHT" --retexture "$IN_RETEX" ${{ inputs.list_only && '--list' || '' }}

      - name: Commit results
        if: always()
        env:
          IN_NAME: ${{ inputs.name }}
          IN_ACTIONS: ${{ inputs.actions }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meshy || true
          if git diff --cached --quiet; then echo "нечего сохранять"; exit 0; fi
          git commit -m "Meshy: $IN_NAME ($IN_ACTIONS)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep $((i*4)); done
