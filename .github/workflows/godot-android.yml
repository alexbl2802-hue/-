name: Godot APK

# Сборка только по команде (вкладка Actions → Run workflow)
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-stable-android

      - name: Install Godot and Android export templates
        run: |
          V=${GODOT_VERSION}-stable
          mkdir -p ~/godot-cache && cd ~/godot-cache
          if [ ! -f godot ]; then
            curl -sSL -o g.zip "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip"
            unzip -q g.zip && mv "Godot_v${V}_linux.x86_64" godot && rm g.zip
          fi
          if [ ! -d templates ]; then
            curl -sSL -o t.tpz "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz"
            unzip -q t.tpz 'templates/android*' 'templates/version.txt' && rm t.tpz
          fi
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T" && cp templates/* "$T/"
          ls "$T"

      - name: Configure Android SDK and signing for Godot
        run: |
          # Первый запуск редактора создаёт файл настроек, затем прописываем SDK и общий отладочный ключ
          ~/godot-cache/godot --headless --editor --path godot --quit || true
          S=~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          KS="${{ github.workspace }}/android/app/debug.keystore"
          sed -i "s|^export/android/android_sdk_path = .*|export/android/android_sdk_path = \"$ANDROID_HOME\"|" "$S"
          sed -i "s|^export/android/debug_keystore = .*|export/android/debug_keystore = \"$KS\"|" "$S"
          sed -i "s|^export/android/debug_keystore_pass = .*|export/android/debug_keystore_pass = \"android\"|" "$S"
          grep -q '^export/android/debug_keystore_user' "$S" \
            && sed -i 's|^export/android/debug_keystore_user = .*|export/android/debug_keystore_user = "androiddebugkey"|' "$S" \
            || echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$S"
          grep '^export/android' "$S"

      - name: Set version
        run: |
          # Номер версии — в игре (главное меню) и в имени файла, чтобы сборки нельзя было перепутать
          echo "VER=2.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          sed -i "s|^config/version=.*|config/version=\"2.0.${{ github.run_number }}\"|" godot/project.godot
          grep '^config/version' godot/project.godot

      - name: Join big models (stored in parts, GitHub file limit 100 MB)
        run: sh tools/join_big.sh

      - name: Import project
        run: ~/godot-cache/godot --headless --path godot --import || true

      - name: Data packs (models and textures, downloaded by the game after install, only what changed)
        run: |
          # Неизменённые части берём байт в байт из прошлого релиза — телефон их не перекачивает
          PREV_PACKS_URL="https://github.com/${{ github.repository }}/releases/latest/download/" python3 tools/data_pack.py ~/godot-cache/godot build
          cat godot/data/packs.json

      - name: Export APK
        run: |
          # Тот же идентификатор и ключ, что у старого приложения, а номер версии выше —
          # поэтому APK ставится поверх старой версии, а не отдельным приложением
          CODE=$((1000 + ${{ github.run_number }}))
          sed -i "s|^version/code=.*|version/code=$CODE|; s|^version/name=.*|version/name=\"$VER\"|" godot/export_presets.cfg
          mkdir -p build
          ~/godot-cache/godot --headless --path godot --export-debug "Android" ../build/ZemliPriklyucheniy-$VER.apk
          ls -la build
          test -s build/ZemliPriklyucheniy-$VER.apk

      - name: Sign with release key (key rotation)
        env:
          KS_B64: ${{ secrets.ZEMLI_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ZEMLI_KEYSTORE_PASS }}
        run: |
          # Своя подпись вместо отладочной. Ключ хранится только в секретах репозитория.
          # Смена ключа по правилам Android (APK Signature Scheme v3, Android 9+): старый
          # отладочный ключ подтверждает новый, поэтому обновление встаёт поверх уже
          # установленной игры и прогресс сохраняется.
          APK=build/ZemliPriklyucheniy-$VER.apk
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::warning::Нет секретов ZEMLI_KEYSTORE_B64 / ZEMLI_KEYSTORE_PASS — APK остаётся с отладочной подписью"
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          OLD="--ks android/app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android"
          NEW="--ks $RUNNER_TEMP/release.jks --ks-key-alias zemli --ks-pass env:KS_PASS --key-pass env:KS_PASS"
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage" --old-signer $OLD --new-signer $NEW
          "$BT/apksigner" sign $OLD --next-signer $NEW --lineage "$RUNNER_TEMP/lineage" --out "$RUNNER_TEMP/signed.apk" "$APK"
          "$BT/apksigner" verify -v --print-certs "$RUNNER_TEMP/signed.apk"
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ZemliPriklyucheniy-${{ env.VER }}-apk
          path: build/ZemliPriklyucheniy-${{ env.VER }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Земли Приключений 2.0.${{ github.run_number }} (Godot)
          body: |
            Игра на движке **Godot 4.7**. Скачай **ZemliPriklyucheniy-${{ env.VER }}.apk** и установи —
            обновление встанет поверх уже установленной игры. Номер версии виден в главном меню.
            При первом запуске игра сама скачает данные (модели и текстуры, файлы pack-*.pck) — нужен интернет.
            При обновлении докачивается только то, что изменилось.
          files: |
            build/ZemliPriklyucheniy-${{ env.VER }}.apk
            build/pack-*.pck
          prerelease: false
          make_latest: true
